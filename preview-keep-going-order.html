<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keep going! 表示Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261112-keep-copy">
<link rel="stylesheet" href="feedback-status-icons.css?v=20261112-allpages">
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 0;font-family:var(--font-latin,Lato,Arial,sans-serif);color:var(--text-primary,#333);background:var(--bg-main,#fff)}
main{width:100%;max-width:none;margin:0}
h1{margin:0 16px 6px;font-size:1.35rem}
.lead,.sample-note{margin:0 16px 14px;color:var(--text-secondary,#64748b)}
.controls{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:12px 16px;margin-bottom:16px;background:var(--bg-panel,#f8fafc)}
.control{display:grid;gap:5px;font-size:.9rem}
.control select,.control input{font:inherit}
.control select{max-width:100%;padding:6px 8px}
.gap-control{min-width:160px}
.gap-control input{width:150px}
.gap-value{font-variant-numeric:tabular-nums}
.stage{width:min(var(--stage-width,100vw),100vw);margin:0 auto;padding:16px;border:1px solid var(--border-color,#ccc);background:var(--bg-main,#fff)}
.result-flow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;column-gap:var(--result-gap,6px);row-gap:4px;min-width:0;padding:12px;background:var(--bg-row,#f8fafc);font-family:var(--font-japanese,sans-serif);font-size:1rem;line-height:1.5}
.transcript-group{display:inline-flex;align-items:baseline;flex:0 1 auto;min-width:0;max-width:100%}
.fire-icon{display:block;flex:0 0 20px;width:20px;height:20px;color:#B47732}
.transcript-text{min-width:0;overflow-wrap:break-word;word-break:normal}
.keep-label{flex:0 0 auto;white-space:nowrap;color:#B47732;font-family:var(--font-latin,Lato,Arial,sans-serif);font-size:1rem;line-height:1.5}
.empty-state{margin:0;text-align:right;color:var(--text-secondary,#64748b);font-family:var(--font-japanese,sans-serif);font-size:1rem}
.measure{margin:10px 0 0;color:var(--text-secondary,#64748b);font: .82rem/1.4 var(--font-latin,Lato,Arial,sans-serif)}
body[data-theme=dark]{color-scheme:dark;--text-primary:#f8fafc;--text-secondary:#cbd5e1;--bg-main:#0f172a;--bg-panel:#1e293b;--bg-row:#1e293b;--border-color:#475569}
body[data-theme=dark] .fire-icon,body[data-theme=dark] .keep-label{color:#E4AD69}
@media(max-width:600px){body{padding:12px 0}.controls{gap:10px;padding:10px 12px}.control{flex:1 1 138px}.gap-control{flex:1 1 100%}.gap-control input{width:min(100%,260px)}.stage{padding:10px}.result-flow{padding:10px}}
</style>
</head>
<body data-theme="light">
<main>
<h1>Keep going! — 認識テキストの後ろに配置</h1>
<p class="lead">比較専用Previewです。本番Practiceページには変更を加えていません。</p>
<section class="controls" aria-label="表示条件">
<label class="control">認識テキスト
<select id="sample"><option value="short">短文</option><option value="long">長文</option><option value="empty">空文字</option></select>
</label>
<label class="control">Theme
<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select>
</label>
<label class="control">表示幅
<select id="width"><option value="auto">画面幅に合わせる</option><option value="375">375px</option><option value="600">600px</option><option value="1440">1440px</option></select>
</label>
<label class="control gap-control">要素間隔 <span><input id="gap" type="range" min="0" max="24" step="1" value="6"> <output class="gap-value" id="gap-value">6px</output></span></label>
</section>
<p class="sample-note">短文・長文は表示比較用のサンプルで、音声認識の実結果ではありません。空文字では認識結果がないため、既存ページと同様にKeep going!の判定表示を出しません。</p>
<section class="stage" id="stage" aria-label="表示Preview">
<div class="result-flow" id="result"></div>
<p class="measure" id="measure"></p>
</section>
<script>
(()=>{'use strict';
const examples={short:'田中さんが料理します。',long:'田中さんが昨日友だちと一緒にレストランで料理を作りました。',empty:''};
const flame='<svg class="fire-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12.5383 4.29449C12.8615 4.05075 13.182 3.86356 13.4688 3.73169C13.5555 5.85881 14.5955 7.45829 15.5965 8.87109C15.6881 9.00031 15.779 9.12767 15.8688 9.25354C16.9522 10.7721 17.8801 12.0725 17.9813 13.794C18.0979 15.7759 17.6036 17.4514 16.6453 18.6176C15.6986 19.7696 14.2385 20.5 12.25 20.5C10.1887 20.5 8.6396 19.9712 7.55849 19.0843C6.48244 18.2015 5.79472 16.9026 5.56502 15.2123C5.33902 13.5492 5.74149 12.3672 6.17625 11.6092C6.26176 11.4601 6.34906 11.3266 6.43394 11.2084L6.74894 11.8066C7.29998 12.8532 8.57839 13.2789 9.64684 12.7716C10.9525 12.1516 11.2311 10.5595 10.8165 9.4416C10.5264 8.65954 10.3721 7.70456 10.7077 6.74841C11.084 5.67629 11.7985 4.85253 12.5383 4.29449ZM6.15636 9.3231L6.15395 9.32491L6.15 9.3279L6.13963 9.33586C6.13164 9.34204 6.12151 9.34999 6.10942 9.35973C6.08524 9.37919 6.05314 9.40581 6.01442 9.43966C5.93703 9.50732 5.83284 9.6042 5.71236 9.73104C5.47171 9.98437 5.16368 10.3598 4.8751 10.8629C4.29291 11.8779 3.80368 13.3906 4.07868 15.4142C4.34997 17.4107 5.18833 19.0801 6.60711 20.244C8.02084 21.4038 9.93533 22 12.25 22C14.6375 22 16.5425 21.1054 17.8042 19.5699C19.0544 18.0486 19.6122 15.9741 19.4787 13.706C19.3508 11.5302 18.1656 9.87945 17.1188 8.42123C17.0177 8.28043 16.9179 8.14142 16.8205 8.00391C15.6785 6.39222 14.7768 4.90657 14.9959 2.82863C15.0182 2.61721 14.9497 2.40625 14.8075 2.24824C14.6652 2.09023 14.4626 2 14.25 2C13.868 2 13.4309 2.11822 13.0077 2.29599C12.5715 2.47923 12.0984 2.74751 11.6351 3.09694C10.7104 3.79438 9.78589 4.84563 9.29236 6.25159C8.80006 7.65408 9.04947 8.99089 9.41008 9.9632C9.64689 10.6017 9.39005 11.233 9.00347 11.4165C8.66159 11.5789 8.25252 11.4427 8.07619 11.1078L7.26887 9.57452C7.16673 9.38052 6.98481 9.24093 6.77099 9.19248C6.55717 9.14403 6.33215 9.19209 6.15636 9.3231Z"/></svg>';
const sample=document.querySelector('#sample'),theme=document.querySelector('#theme'),width=document.querySelector('#width'),gap=document.querySelector('#gap'),stage=document.querySelector('#stage'),result=document.querySelector('#result');
function render(){
 document.body.dataset.theme=theme.value;
 document.documentElement.style.setProperty('--result-gap',gap.value+'px');
 document.querySelector('#gap-value').value=gap.value+'px';
 const w=width.value==='auto'?window.innerWidth:Number(width.value);
 document.documentElement.style.setProperty('--stage-width',w+'px');
 const text=examples[sample.value];
 result.replaceChildren();
 if(!text){result.append(Object.assign(document.createElement('p'),{className:'empty-state',textContent:'… Not yet'}));}
 else{
  const group=document.createElement('span');group.className='transcript-group';group.innerHTML=flame;
  const transcript=document.createElement('span');transcript.className='transcript-text';transcript.textContent=text;group.append(transcript);
  const keep=document.createElement('span');keep.className='keep-label';keep.lang='en';keep.textContent='Keep going!';
  result.append(group,keep);
 }
 const rect=stage.getBoundingClientRect();
 document.querySelector('#measure').textContent='Preview領域: '+Math.round(rect.width)+'px / ブラウザー画面幅: '+window.innerWidth+'px';
}
[sample,theme,width,gap].forEach(x=>x.addEventListener('input',render));
[sample,theme,width].forEach(x=>x.addEventListener('change',render));
window.addEventListener('resize',render);
render();
})();
</script>
</main>
</body>
</html>
