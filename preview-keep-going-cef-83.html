<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice 8.3 — Keep going! C/E/F Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{color-scheme:light dark}body{font-family:Lato,Arial,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;line-height:1.5}
.preview-intro{margin-bottom:20px}.preview-note{font-size:13px;opacity:.75}
.sample{border:1px solid #9ca3af55;border-radius:8px;padding:16px;margin:16px 0;background:light-dark(#fff,#20252c)}
.sample h2{font-size:16px;margin:0 0 12px}.exercise{border-bottom:1px solid #9ca3af55;padding:8px 0 14px}
.cue{font-size:16px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.fake-button{border:1px solid #9ca3af66;border-radius:5px;padding:5px 9px;background:light-dark(#f4f5f7,#343b46);font-size:14px}
.transcript{margin-left:auto;text-align:right;min-width:0;overflow-wrap:break-word}
.keep-going{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:17px;margin-top:12px}
.flame{width:19px;height:22px;fill:currentColor;flex:none}
[data-color="C"]{color:#3978B5}[data-color="E"]{color:#B47732}[data-color="F"]{color:#159C92}
@media(prefers-color-scheme:dark){[data-color="C"]{color:#79B8F0}[data-color="E"]{color:#E4AD69}[data-color="F"]{color:#58CDBF}}
</style></head><body>
<header class="preview-intro"><h1>Practice 8.3 — Keep going! 色比較</h1>
<p>候補 C / E / F を同じ表示条件で比較します。炎と文字は同色、背景・枠なし。</p>
<p class="preview-note">これは独立した視覚比較ページです。録音・再生・判定ボタンは操作できません。Practice 8.3 本体の機能や既存配置は変更していません。Dark mode は端末設定に追従します。Dark用カラーは比較用の暫定調整値です。</p></header>
<main id="samples"></main>
<script>
const colors=[["C","ブルー","#3978B5"],["E","オレンジ","#B47732"],["F","青緑","#159C92"]];
const flame='<svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 1.5c1.7 4.1-1.2 5.8.1 8.3 1.4-.8 2.4-2.3 2.7-4.2 3.9 4 6 8 5.1 11.7-.8 3.9-4.1 6.2-8.2 6.2S4.4 21 3.7 17.1C2.8 12.6 5.5 8.8 8.5 6c-.4 3.2.7 4.5 1.7 5.3C9.9 7.6 12.5 5.2 12.2 1.5Z"/></svg>';
document.getElementById('samples').innerHTML=colors.map(([key,name,hex])=>`<section class="sample"><h2>候補 ${key} — ${name} (${hex})</h2><div class="exercise"><div class="cue">Drill 1　だれが来ましたか。</div><div class="controls"><span class="fake-button">⏺️</span><span class="fake-button">🔊</span><span class="fake-button">⏹️</span><span class="transcript">だれがきましたか。</span></div><div class="keep-going" data-color="${key}">${flame}<span>Keep going!</span></div></div></section>`).join('');
</script></body></html>
