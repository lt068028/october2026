
    <hr>
    <p>
        音声認識テスト：
        <button id="testMicButton" type="button">🎙️ とる</button>
    </p>
    <p id="testMicResult">ここに認識結果またはエラーが表示されます。</p>

    <script>
    (() => {
        const button = document.getElementById("testMicButton");
        const output = document.getElementById("testMicResult");

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            output.textContent =
                "このブラウザでは SpeechRecognition API が利用できません。";
            button.disabled = true;
            return;
        }

        let recognition = null;

        button.addEventListener("click", () => {
            if (recognition) {
                output.textContent = "前の認識処理が終了するまでお待ちください。";
                return;
            }

            const current = new SpeechRecognition();
            recognition = current;

            current.lang = "ja-JP";
            current.continuous = false;
            current.interimResults = false;

            button.disabled = true;
            output.textContent = "認識中です。日本語で話してください。";

            current.onresult = (event) => {
                output.textContent =
                    "認識結果：" + event.results[0][0].transcript;
            };

            current.onerror = (event) => {
                output.textContent =
                    "エラー：" + event.error +
                    (event.message ? " (" + event.message + ")" : "");
            };

            current.onend = () => {
                if (recognition === current) {
                    recognition = null;
                    button.disabled = false;
                }
            };

            try {
                current.start();
            } catch (error) {
                output.textContent =
                    "開始エラー：" + error.name + " - " + error.message;
                recognition = null;
                button.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
