<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice 7.1 — Yes / No icon comparison</title>
<style>
:root{font-family:Arial,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202c}
header{background:white;padding:15px 20px;border-bottom:1px solid #d8dee8}h1{font-size:1.1rem;margin:0 0 9px}
nav{display:flex;gap:8px;flex-wrap:wrap}nav button{font:inherit;font-size:.86rem;background:white;color:#17202c;border:1px solid #b8c2d0;border-radius:8px;padding:9px 12px;cursor:pointer}
nav button[aria-pressed=true]{background:#e7f1ff;border:2px solid #2471bd;padding:8px 11px;font-weight:700}
small{display:block;color:#546070;margin-top:9px}.comparison{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid #d8dee8}.comparison .sample{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:42px;border-radius:7px;cursor:pointer;font-size:23px}.comparison .sample[aria-pressed=true]{outline:2px solid #64748b;outline-offset:1px}.comparison .sample svg{pointer-events:none}.comparison .hint{font-size:12px;color:#546070}iframe{width:100%;height:calc(100vh - 198px);border:0;background:white}
@media(max-width:600px){header{padding:10px}iframe{height:calc(100vh - 270px)}} 
</style></head><body><header><h1>Practice 7.1 — Yes / No icon comparison (Preview only)</h1><nav id="options"></nav><small id="status">実際のPractice 7.1を読み込み、回答選択ボタンとExample・説明文内のY/Nマークを比較します。本番ページは変更しません。</small></header>
<div id="mode-gallery" class="comparison" style="display:flex;gap:8px;flex-wrap:wrap;align-items:stretch"></div>
<div class="comparison" id="comparison"><strong>切り替え比較</strong><button class="sample" data-answer="yes" aria-label="Yes" aria-pressed="false"></button><button class="sample" data-answer="no" aria-label="No" aria-pressed="false"></button><span class="hint">上のアイコン種類・背景ボタンを押すと即時反映。Yes/Noも何度でも切り替え可能。</span></div>
<iframe id="practice" title="Practice 7.1 preview" src="practice7.1.html"></iframe>
<script>
'use strict';
const icons={
 personAdd:'<path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4ZM6 8V5H4v3H1v2h3v3h2v-3h3V8H6Z"/>',
 personRemove:'<path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4ZM1 8h8v2H1Z"/>',
 check:'<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
 x:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6m0-6 6 6"/>',
 thumbsUp:'<path d="M7 10v12H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h3Zm0 0 4-8a3 3 0 0 1 3 3v3h5a3 3 0 0 1 3 3l-1 8a3 3 0 0 1-3 3H7"/>',
 thumbsDown:'<path d="M7 14V2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3Zm0 0 4 8a3 3 0 0 0 3-3v-3h5a3 3 0 0 0 3-3l-1-8a3 3 0 0 0-3-3H7"/>',
 smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/>',
 frown:'<circle cx="12" cy="12" r="10"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/>'
};
const modes=[{id:'current',label:'現状 🙆 / 🙅'},{id:'person',label:'A · Google Person Add / Remove'},{id:'lucide',label:'Lucide · Check / X'},{id:'thumbs',label:'Lucide · Thumbs Up / Down'},{id:'smile',label:'Lucide · Smile / Frown (No eyes · Mono)'},{id:'smileColor',label:'Lucide · Smile / Frown (No eyes · Color)'}];
let active='current',observer=null;
const frame=document.getElementById('practice'),nav=document.getElementById('options');
const bg=document.createElement('button');bg.textContent='背景: ウォームグレー #F5F2EE';bg.setAttribute('aria-pressed','true');bg.dataset.cool='true';bg.onclick=()=>{bg.dataset.cool=bg.dataset.cool==='true'?'false':'true';bg.setAttribute('aria-pressed',bg.dataset.cool);bg.textContent=bg.dataset.cool==='true'?'背景: ウォームグレー #F5F2EE':'背景: 元のブルー';decorate(true);refreshComparison()};nav.append(bg);
function mark(yes){if(active==='current')return yes?'🙆':'🙅';const key=active==='person'?(yes?'personAdd':'personRemove'):active==='lucide'?(yes?'check':'x'):active==='thumbs'?(yes?'thumbsUp':'thumbsDown'):(yes?'smile':'frown');return svg(key,active==='person',active==='smileColor'?(yes?'#16a34a':'#dc2626'):null)}
function paintEmoji(doc,root){const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT);const matches=[];while(walker.nextNode()){const n=walker.currentNode;if(/[🙆🙅]/u.test(n.nodeValue)&&!n.parentElement.closest('script,style,.p71-preview-inline-icon,button.answer-choice'))matches.push(n)}for(const n of matches){const parts=n.nodeValue.split(/(🙆|🙅)/u);const frag=doc.createDocumentFragment();for(const part of parts){if(part==='🙆'||part==='🙅'){const span=doc.createElement('span');span.className='p71-preview-inline-icon';span.dataset.answer=part==='🙆'?'yes':'no';span.innerHTML=mark(part==='🙆');frag.append(span)}else if(part)frag.append(doc.createTextNode(part))}n.replaceWith(frag)}}
function svg(key,material=false,color=null){return '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" aria-hidden="true" fill="'+(material?'currentColor':'none')+'" stroke="'+(material?'none':(color||'currentColor'))+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;pointer-events:none">'+icons[key]+'</svg>'}
function decorate(force=false){
 if(observer)observer.disconnect();
 const doc=frame.contentDocument;
 try {
 if(!doc||!doc.body)return;
 let style=doc.getElementById('p71-preview-styles');if(!style){style=doc.createElement('style');style.id='p71-preview-styles';doc.head.append(style)}
 const cool=bg.dataset.cool==='true';if(force||!style.textContent)style.textContent=` .practice7-page .example-button.answer-choice{background:${cool?'#F5F2EE':'#bae6fd'}!important;color:#17202c!important;border:1px solid ${cool?'#DDD5CC':'#a4d6f0'}!important} .practice7-page .example-button.answer-choice[data-answer=yes][aria-pressed=true]{background:#4ade80!important} .practice7-page .example-button.answer-choice[data-answer=no][aria-pressed=true]{background:#fca5a5!important} @media(prefers-color-scheme:dark){.practice7-page .example-button.answer-choice[data-answer=yes][aria-pressed=true]{background:#14532d!important;color:#bbf7d0!important}.practice7-page .example-button.answer-choice[data-answer=no][aria-pressed=true]{background:#7f1d1d!important;color:#fecaca!important}} .practice7-page .example-button.answer-choice[aria-pressed=true]{outline:2px solid #64748b;outline-offset:1px} .p71-preview-inline-icon{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;line-height:1;white-space:nowrap} .p71-preview-inline-icon svg{width:20px;height:20px} `;
 doc.querySelectorAll('button.answer-choice').forEach(btn=>{const yes=btn.dataset.answer==='yes';if(btn.dataset.iconPreview===active)return;btn.dataset.iconPreview=active;btn.innerHTML=mark(yes);btn.setAttribute('aria-label',yes?'Affirmative response':'Negative response')});
 doc.querySelectorAll('.p71-preview-inline-icon').forEach(el=>{if(force||el.dataset.iconPreview!==active){el.innerHTML=mark(el.dataset.answer==='yes');el.dataset.iconPreview=active}});
 // Replace icon glyphs in Example audio buttons, sentence text, and Drill 2 instructions, without replacing handlers.
 doc.querySelectorAll('.example-box,.practice-qa-section .info-panel,.practice-qa-section .recording-table').forEach(el=>paintEmoji(doc,el));
 } finally {if(observer && doc.body)observer.observe(doc.body,{subtree:true,childList:true})}
}

function refreshComparison(){const cool=bg.dataset.cool==='true';document.querySelectorAll('#comparison .sample').forEach(btn=>{const yes=btn.dataset.answer==='yes';btn.innerHTML=mark(yes);const selected=btn.getAttribute('aria-pressed')==='true';btn.style.background=selected?(yes?'#4ade80':'#fca5a5'):(cool?'#F5F2EE':'#bae6fd');btn.style.border='1px solid '+(cool?'#DDD5CC':'#a4d6f0');btn.style.color='#17202c';});}
document.querySelectorAll('#comparison .sample').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('#comparison .sample').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));refreshComparison();});
function select(id){active=id;refreshComparison();renderGallery();nav.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===id)));try{decorate();}catch(err){document.getElementById('status').textContent='アイコン比較は上部で利用できます。埋め込み反映エラー: '+err.message;}}
modes.forEach(m=>{const b=document.createElement('button');b.type='button';b.dataset.mode=m.id;b.textContent=m.label;b.setAttribute('aria-pressed',String(m.id===active));b.onclick=()=>select(m.id);nav.append(b)});
function renderGallery(){const gallery=document.getElementById('mode-gallery');gallery.replaceChildren();for(const m of modes){const b=document.createElement('button');b.type='button';b.style.cssText='font:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px;border:2px solid '+(m.id===active?'#2471bd':'#b8c2d0')+';border-radius:8px;background:'+(m.id===active?'#e7f1ff':'white')+';color:#17202c;cursor:pointer;min-width:125px';b.setAttribute('aria-pressed',String(m.id===active));const name=document.createElement('span');name.style.fontSize='12px';name.textContent=m.label;const icons=document.createElement('span');icons.style.cssText='display:flex;gap:16px;align-items:center';const prev=active;active=m.id;icons.innerHTML=mark(true)+mark(false);active=prev;b.append(icons,name);b.onclick=()=>select(m.id);gallery.append(b);}}
refreshComparison();renderGallery();
frame.addEventListener('load',()=>{
 try{
  if(observer)observer.disconnect();
  const doc=frame.contentDocument;
  if(!doc||!doc.body)throw Error('Cannot access preview document');
  // Preview-only: keep Y/N selection interactive without invoking the production
  // renderAll() path, which replaces the comparison controls.
  doc.addEventListener('click',event=>{
   const choice=event.target.closest?.('button.answer-choice');
   if(!choice)return;
   event.preventDefault();
   event.stopImmediatePropagation();
   const row=choice.closest('tr')||choice.parentElement;
   row.querySelectorAll('button.answer-choice').forEach(button=>{
    button.setAttribute('aria-pressed',String(button===choice));
   });
  },true);
  observer=new MutationObserver(()=>decorate());
  decorate();
  document.getElementById('status').textContent='比較対象：DrillのY/Nボタン、Exampleの音声ボタン・文中マーク、Drill 2の説明文。背景はウォームグレー／元のブルーを切替可能。本番ページは変更しません。';
 }catch(err){document.getElementById('status').textContent='Preview error: '+err.message;}
});
</script></body></html>
