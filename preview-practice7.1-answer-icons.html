<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice 7.1 — Yes / No icon comparison</title>
<style>
:root{font-family:Arial,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202c}
header{background:white;padding:15px 20px;border-bottom:1px solid #d8dee8}h1{font-size:1.1rem;margin:0 0 9px}
nav{display:flex;gap:8px;flex-wrap:wrap}nav button{font:inherit;font-size:.86rem;background:white;color:#17202c;border:1px solid #b8c2d0;border-radius:8px;padding:9px 12px;cursor:pointer}
nav button[aria-pressed=true]{background:#e7f1ff;border:2px solid #2471bd;padding:8px 11px;font-weight:700}
small{display:block;color:#546070;margin-top:9px}iframe{width:100%;height:calc(100vh - 137px);border:0;background:white}
@media(max-width:600px){header{padding:10px}iframe{height:calc(100vh - 205px)}} 
</style></head><body><header><h1>Practice 7.1 — Yes / No icon comparison (Preview only)</h1><nav id="options"></nav><small id="status">実際のPractice 7.1を読み込み、回答選択ボタンとExample・説明文内のY/Nマークを比較します。本番ページは変更しません。</small></header>
<iframe id="practice" title="Practice 7.1 preview" src="practice7.1.html"></iframe>
<script>
'use strict';
const icons={
 personAdd:'<path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4ZM6 8V5H4v3H1v2h3v3h2v-3h3V8H6Z"/>',
 personRemove:'<path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4ZM1 8h8v2H1Z"/>',
 check:'<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
 x:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6m0-6 6 6"/>',
 thumbsUp:'<path d="M7 10v12H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h3Zm0 0 4-8a3 3 0 0 1 3 3v3h5a3 3 0 0 1 3 3l-1 8a3 3 0 0 1-3 3H7"/>',
 thumbsDown:'<path d="M7 14V2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3Zm0 0 4 8a3 3 0 0 0 3-3v-3h5a3 3 0 0 0 3-3l-1-8a3 3 0 0 0-3-3H7"/>',
 smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/>',
 frown:'<circle cx="12" cy="12" r="10"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/>'
};
const modes=[{id:'current',label:'現状 🙆 / 🙅'},{id:'person',label:'A · Google Person Add / Remove'},{id:'lucide',label:'Lucide · Check / X'},{id:'thumbs',label:'Lucide · Thumbs Up / Down'},{id:'smile',label:'Lucide · Smile / Frown (No eyes · Mono)'},{id:'smileColor',label:'Lucide · Smile / Frown (No eyes · Color)'}];
let active='current',observer=null;
const frame=document.getElementById('practice'),nav=document.getElementById('options');
const bg=document.createElement('button');bg.textContent='背景: クールグレー #F3F5F7';bg.setAttribute('aria-pressed','true');bg.dataset.cool='true';bg.onclick=()=>{bg.dataset.cool=bg.dataset.cool==='true'?'false':'true';bg.setAttribute('aria-pressed',bg.dataset.cool);bg.textContent=bg.dataset.cool==='true'?'背景: クールグレー #F3F5F7':'背景: 元のブルー';decorate(true)};nav.append(bg);
function mark(yes){if(active==='current')return yes?'🙆':'🙅';const key=active==='person'?(yes?'personAdd':'personRemove'):active==='lucide'?(yes?'check':'x'):active==='thumbs'?(yes?'thumbsUp':'thumbsDown'):(yes?'smile':'frown');return svg(key,active==='person',active==='smileColor'?(yes?'#16a34a':'#dc2626'):null)}
function paintEmoji(doc,root){const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT);const matches=[];while(walker.nextNode()){const n=walker.currentNode;if(/[🙆🙅]/u.test(n.nodeValue)&&!n.parentElement.closest('script,style,.p71-preview-inline-icon,button.answer-choice'))matches.push(n)}for(const n of matches){const parts=n.nodeValue.split(/(🙆|🙅)/u);const frag=doc.createDocumentFragment();for(const part of parts){if(part==='🙆'||part==='🙅'){const span=doc.createElement('span');span.className='p71-preview-inline-icon';span.dataset.answer=part==='🙆'?'yes':'no';span.innerHTML=mark(part==='🙆');frag.append(span)}else if(part)frag.append(doc.createTextNode(part))}n.replaceWith(frag)}}
function svg(key,material=false,color=null){return '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" aria-hidden="true" fill="'+(material?'currentColor':'none')+'" stroke="'+(material?'none':(color||'currentColor'))+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;pointer-events:none">'+icons[key]+'</svg>'}
function decorate(force=false){
 if(observer)observer.disconnect();
 try {
 const doc=frame.contentDocument;if(!doc||!doc.body)return;
 let style=doc.getElementById('p71-preview-styles');if(!style){style=doc.createElement('style');style.id='p71-preview-styles';doc.head.append(style)}
 const cool=bg.dataset.cool==='true';if(force||!style.textContent)style.textContent=` .practice7-page .example-button.answer-choice{background:${cool?'#F3F5F7':'#bae6fd'}!important;color:#17202c!important;border:1px solid ${cool?'#D8DEE4':'#a4d6f0'}!important} .practice7-page .example-button.answer-choice[aria-pressed=true]{outline:2px solid #64748b;outline-offset:1px} .p71-preview-inline-icon{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;line-height:1;white-space:nowrap} .p71-preview-inline-icon svg{width:20px;height:20px} `;
 doc.querySelectorAll('button.answer-choice').forEach(btn=>{const yes=btn.dataset.answer==='yes';if(btn.dataset.iconPreview===active)return;btn.dataset.iconPreview=active;btn.innerHTML=mark(yes);btn.setAttribute('aria-label',yes?'Affirmative response':'Negative response')});
 doc.querySelectorAll('.p71-preview-inline-icon').forEach(el=>{if(force||el.dataset.iconPreview!==active){el.innerHTML=mark(el.dataset.answer==='yes');el.dataset.iconPreview=active}});
 // Replace icon glyphs in Example audio buttons, sentence text, and Drill 2 instructions, without replacing handlers.
 doc.querySelectorAll('.example-box,.practice-qa-section .info-panel,.practice-qa-section .recording-table').forEach(el=>paintEmoji(doc,el));
 } finally {if(observer && doc.body)observer.observe(doc.body,{subtree:true,childList:true})}
}

function select(id){active=id;nav.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===id)));decorate();}
modes.forEach(m=>{const b=document.createElement('button');b.type='button';b.dataset.mode=m.id;b.textContent=m.label;b.setAttribute('aria-pressed',String(m.id===active));b.onclick=()=>select(m.id);nav.append(b)});
frame.addEventListener('load',()=>{
 try{
  if(observer)observer.disconnect();
  const doc=frame.contentDocument;
  if(!doc||!doc.body)throw Error('Cannot access preview document');
  observer=new MutationObserver(()=>decorate());
  decorate();
  document.getElementById('status').textContent='比較対象：DrillのY/Nボタン、Exampleの音声ボタン・文中マーク、Drill 2の説明文。背景はクールグレー／元のブルーを切替可能。本番ページは変更しません。';
 }catch(err){document.getElementById('status').textContent='Preview error: '+err.message;}
});
</script></body></html>
