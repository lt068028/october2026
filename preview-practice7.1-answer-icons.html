<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice 7.1 — Yes / No icon comparison</title>
<style>
:root{font-family:Arial,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202c}
header{background:white;padding:15px 20px;border-bottom:1px solid #d8dee8}h1{font-size:1.1rem;margin:0 0 9px}
nav{display:flex;gap:8px;flex-wrap:wrap}nav button{font:inherit;font-size:.86rem;background:white;color:#17202c;border:1px solid #b8c2d0;border-radius:8px;padding:9px 12px;cursor:pointer}
nav button[aria-pressed=true]{background:#e7f1ff;border:2px solid #2471bd;padding:8px 11px;font-weight:700}
small{display:block;color:#546070;margin-top:9px}iframe{width:100%;height:calc(100vh - 137px);border:0;background:white}
@media(max-width:600px){header{padding:10px}iframe{height:calc(100vh - 205px)}} 
</style></head><body><header><h1>Practice 7.1 — Yes / No icon comparison (Preview only)</h1><nav id="options"></nav><small id="status">実際のPractice 7.1を読み込み、回答選択ボタンのアイコンだけを比較します。本番ページは変更しません。</small></header>
<iframe id="practice" title="Practice 7.1 preview" src="practice7.1.html"></iframe>
<script>
'use strict';
const icons={
 personAdd:'<path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4ZM6 8V5H4v3H1v2h3v3h2v-3h3V8H6Z"/>',
 personRemove:'<path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4ZM1 8h8v2H1Z"/>',
 check:'<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
 x:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6m0-6 6 6"/>',
 thumbsUp:'<path d="M7 10v12H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h3Zm0 0 4-8a3 3 0 0 1 3 3v3h5a3 3 0 0 1 3 3l-1 8a3 3 0 0 1-3 3H7"/>',
 thumbsDown:'<path d="M7 14V2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3Zm0 0 4 8a3 3 0 0 0 3-3v-3h5a3 3 0 0 0 3-3l-1-8a3 3 0 0 0-3-3H7"/>',
 smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/>',
 frown:'<circle cx="12" cy="12" r="10"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/>'
};
const modes=[{id:'current',label:'現状 🙆 / 🙅'},{id:'person',label:'A · Google Person Add / Remove'},{id:'lucide',label:'Lucide · Check / X'},{id:'thumbs',label:'Lucide · Thumbs Up / Down'},{id:'smile',label:'Lucide · Smile / Frown (No eyes · Mono)'},{id:'smileColor',label:'Lucide · Smile / Frown (No eyes · Color)'}];
let active='current',observer=null;
const frame=document.getElementById('practice'),nav=document.getElementById('options');
function svg(key,material=false,color=null){return '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" aria-hidden="true" fill="'+(material?'currentColor':'none')+'" stroke="'+(material?'none':(color||'currentColor'))+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;pointer-events:none">'+icons[key]+'</svg>'}
function decorate(){
 const doc=frame.contentDocument;if(!doc||!doc.body)return;
 doc.querySelectorAll('button.answer-choice').forEach(btn=>{
  const yes=btn.dataset.answer==='yes';
  if(btn.dataset.iconPreview===active)return;
  btn.dataset.iconPreview=active;
  if(active==='current'){btn.textContent=yes?'🙆':'🙅';return}
  const key=active==='person'?(yes?'personAdd':'personRemove'):active==='lucide'?(yes?'check':'x'):active==='thumbs'?(yes?'thumbsUp':'thumbsDown'):(yes?'smile':'frown');
  btn.innerHTML=svg(key,active==='person',active==='smileColor'?(yes?'#16a34a':'#dc2626'):null);
  btn.setAttribute('aria-label',yes?'Affirmative response':'Negative response');
 });
}
function select(id){active=id;nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===id)));decorate();}
modes.forEach(m=>{const b=document.createElement('button');b.type='button';b.dataset.mode=m.id;b.textContent=m.label;b.setAttribute('aria-pressed',String(m.id===active));b.onclick=()=>select(m.id);nav.append(b)});
frame.addEventListener('load',()=>{
 try{
  if(observer)observer.disconnect();
  const doc=frame.contentDocument;
  if(!doc||!doc.body)throw Error('Cannot access preview document');
  observer=new MutationObserver(()=>decorate());
  observer.observe(doc.body,{subtree:true,childList:true});
  decorate();
  document.getElementById('status').textContent='比較対象：Drill内のYes / No選択ボタンのみ。切替・再描画後も適用。本番ページは変更しません。';
 }catch(err){document.getElementById('status').textContent='Preview error: '+err.message;}
});
</script></body></html>
