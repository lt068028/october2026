<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* ドリル項目およびピッチラインのスタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
        .pitch-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 10px;
            margin-bottom: 8px;
        }
        .mora-line {
            display: flex;
            gap: 0;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .mora-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2px;
        }
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line-path {
            fill: none;
            stroke: #e11d48;
            stroke-width: 1;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- ドリルリストが動的に挿入されるエリア -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
