<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* ピッチライン（SVGステップ表示）用スタイル */
        .custom-pitch-container {
            margin-bottom: 30px;
        }
        .pitch-row {
            display: flex;
            gap: 2px; /* ｜前後のスペースを最小限に設定 */
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .pitch-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 15px;
        }
        .mora-line {
            display: flex;
            gap: 0;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .mora-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2px;
        }
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line-path {
            fill: none;
            stroke: #e11d48;
            stroke-width: 1;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 指定された全文の表示エリア -->
    <div class="custom-pitch-container" id="customPitchArea"></div>

    <!-- これまでに作成された元のドリルリスト表示エリア -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
    <script>
        // 貴殿が提示したテキスト（記号付き）をそのまま一字一句変えずに定義
        const targetSentences = [
            "いいてんきですね",
            "し↗ごとは｜た↗のし↘いです",
            "べ↗んきょうは｜お↗もしろ↘いです",
            "じ↗かんが｜ないですか⤴",
            "て↘んきが｜わ↗る↘いですか",
            "て↘んきが｜よ↘くないです"
        ];

        // 記号付き文字列を解析して、純粋な文字配列とアクセント構造を抽出するパーサー
        function parseSegment(rawSegment) {
            let chars = [];
            let startLow = false;
            let riseIndex = -1;
            let dropIndex = -1;
            let hasEndRise = false;

            let i = 0;
            while (i < rawSegment.length) {
                let char = rawSegment[i];
                if (char === '↘') {
                    dropIndex = chars.length - 1; // 直前の文字の後ろで下がる
                    i++;
                } else if (char === '↗') {
                    riseIndex = chars.length; // この位置で上がる
                    startLow = true;
                    i++;
                } else if (char === '⤴') {
                    hasEndRise = true;
                    i++;
                } else {
                    chars.push(char);
                    i++;
                }
            }

            // 最初の文字の前に記号がなくても、途中（riseIndex > 0）で上がっていれば先頭は低いはず
            if (riseIndex > 0) {
                startLow = true;
            }

            return { chars, startLow, riseIndex, dropIndex, hasEndRise };
        }

        function renderCustomPitchRows() {
            const container = document.getElementById("customPitchArea");
            if (!container) return;
            container.innerHTML = "";

            targetSentences.forEach(fullText => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "pitch-row";

                // 「｜」でセグメントに分割
                const rawSegments = fullText.split("｜");

                rawSegments.forEach(rawSeg => {
                    const parsed = parseSegment(rawSeg);
                    const wrapper = document.createElement("div");
                    wrapper.className = "pitch-wrapper";

                    const moraLine = document.createElement("div");
                    moraLine.className = "mora-line";

                    parsed.chars.forEach((char, idx) => {
                        const moraItem = document.createElement("div");
                        moraItem.className = "mora-item";
                        const span = document.createElement("span");
                        
                        // 文末の ⤴ などの処理
                        if (idx === parsed.chars.length - 1 && parsed.hasEndRise) {
                            span.textContent = char + '⤴';
                            span.style.fontSize = "16px";
                        } else {
                            span.textContent = char;
                        }
                        
                        moraItem.appendChild(span);
                        moraLine.appendChild(moraItem);
                    });
                    wrapper.appendChild(moraLine);

                    const charCount = parsed.chars.length;
                    const unitWidth = 24.5;
                    const svgWidth = charCount * unitWidth;

                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("class", "pitch-svg");
                    svg.setAttribute("viewBox", `0 0 ${svgWidth} 50`);
                    svg.setAttribute("preserveAspectRatio", "none");

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("class", "pitch-line-path");

                    let pathD = "";
                    const startY = parsed.startLow ? 46 : 18;

                    // パス生成ロジック（上昇・下降・平坦の組み合わせ）
                    if (parsed.startLow && parsed.riseIndex !== -1) {
                        const riseX = parsed.riseIndex * unitWidth;
                        if (parsed.dropIndex !== -1 && parsed.dropIndex < charCount - 1) {
                            const dropX = (parsed.dropIndex + 1) * unitWidth;
                            pathD = `M 2,${startY} L ${riseX},${startY} L ${riseX},18 L ${dropX},18 L ${dropX},46 L ${svgWidth - 2},46`;
                        } else if (parsed.dropIndex === charCount - 1) {
                            const dropX = (parsed.dropIndex + 1) * unitWidth;
                            pathD = `M 2,${startY} L ${riseX},${startY} L ${riseX},18 L ${dropX},18`;
                        } else {
                            pathD = `M 2,${startY} L ${riseX},${startY} L ${riseX},18 L ${svgWidth - 2},18`;
                        }
                    } else {
                        if (parsed.dropIndex === -1 || parsed.dropIndex >= charCount - 1) {
                            if (parsed.dropIndex === charCount - 1) {
                                const dropX = (parsed.dropIndex + 1) * unitWidth;
                                pathD = `M 2,${startY} L ${dropX},${startY} L ${dropX},46 L ${svgWidth - 2},46`;
                            } else {
                                pathD = `M 2,${startY} L ${svgWidth - 2},${startY}`;
                            }
                        } else {
                            const dropX = (parsed.dropIndex + 1) * unitWidth;
                            pathD = `M 2,${startY} L ${dropX},${startY} L ${dropX},46 L ${svgWidth - 2},46`;
                        }
                    }

                    path.setAttribute("d", pathD);
                    svg.appendChild(path);
                    wrapper.appendChild(svg);

                    rowDiv.appendChild(wrapper);
                });

                container.appendChild(rowDiv);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderCustomPitchRows();
        });
    </script>
</body>
</html>
