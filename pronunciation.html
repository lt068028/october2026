<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* ピッチライン（SVGステップ表示）共通スタイル */
        .pitch-container {
            margin: 15px 0;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border: 1px solid var(--border-color, #cbd5e1);
            border-radius: 8px;
            display: inline-block;
        }
        .pitch-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 10px;
        }
        .mora-line {
            display: flex;
            gap: 0;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .mora-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2px;
        }
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line-path {
            fill: none;
            stroke: #e11d48;
            stroke-width: 1;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- タイトルの下に「いいてんきですね」のテスト表示を配置 -->
    <div class="pitch-container">
        <div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">Pitch Accent Pattern (Test)</div>
        <div class="pitch-wrapper">
            <div class="mora-line">
                <div class="mora-item"><span>い</span></div>
                <div class="mora-item"><span>い</span></div>
                <div class="mora-item"><span>て</span></div>
                <div class="mora-item"><span>ん</span></div>
                <div class="mora-item"><span>き</span></div>
                <div class="mora-item"><span>で</span></div>
                <div class="mora-item"><span>す</span></div>
                <div class="mora-item"><span>ね</span></div>
            </div>
            <svg class="pitch-svg" viewBox="0 0 196 50" preserveAspectRatio="none">
                <path class="pitch-line-path" d="
                    M 2,18 
                    L 26,18 
                    L 26,46 
                    L 194,46
                " />
            </svg>
        </div>
    </div>

    <!-- ドリルリストが動的に挿入されるエリア -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
