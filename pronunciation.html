<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill - Accent Symbol Render Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }
        .test-panel {
            margin: 20px 0;
            padding: 20px;
            background: var(--bg-panel, #f8fafc);
            border: 1px solid var(--border-color, #cbd5e1);
            border-radius: 8px;
        }
        .pitch-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 10px;
            margin-top: 10px;
        }
        .mora-line {
            display: flex;
            gap: 0;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .mora-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2px;
        }
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line-path {
            fill: none;
            stroke: #e11d48;
            stroke-width: 1;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            padding: 6px 10px;
            font-size: 16px;
            width: 300px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <div class="test-panel">
        <h2>アクセント記号連動描画テスト</h2>
        <div class="input-group">
            <label for="accentInput">アクセント記号付きテキスト（例: い＼いてんきですね）:</label>
            <input type="text" id="accentInput" value="い＼いてんきですね" oninput="updatePitchRender()">
        </div>

        <div id="renderArea"></div>
    </div>

    <script>
        function updatePitchRender() {
            const rawText = document.getElementById("accentInput").value;
            const renderArea = document.getElementById("renderArea");
            renderArea.innerHTML = "";

            // 記号（＼など）を除外した純粋な文字配列と、下がり目インデックスの特定
            let chars = [];
            let dropIndex = -1;
            
            let charIndex = 0;
            for (let i = 0; i < rawText.length; i++) {
                const char = rawText[i];
                if (char === '＼') {
                    // 直前の文字の後ろで下がる
                    dropIndex = charIndex - 1;
                } else {
                    chars.push(char);
                    charIndex++;
                }
            }

            const wrapper = document.createElement("div");
            wrapper.className = "pitch-wrapper";

            const moraLine = document.createElement("div");
            moraLine.className = "mora-line";

            chars.forEach(char => {
                const moraItem = document.createElement("div");
                moraItem.className = "mora-item";
                const span = document.createElement("span");
                span.textContent = char;
                moraItem.appendChild(span);
                moraLine.appendChild(moraItem);
            });
            wrapper.appendChild(moraLine);

            const charCount = chars.length;
            const unitWidth = 24.5;
            const svgWidth = charCount * unitWidth;

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("class", "pitch-svg");
            svg.setAttribute("viewBox", `0 0 ${svgWidth} 50`);
            svg.setAttribute("preserveAspectRatio", "none");

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("class", "pitch-line-path");

            let pathD = "";
            if (dropIndex === -1 || dropIndex >= charCount - 1) {
                pathD = `M 2,18 L ${svgWidth - 2},18`;
            } else {
                const dropX = (dropIndex + 1) * unitWidth;
                pathD = `M 2,18 L ${dropX},18 L ${dropX},46 L ${svgWidth - 2},46`;
            }
            path.setAttribute("d", pathD);
            svg.appendChild(path);
            wrapper.appendChild(svg);

            renderArea.appendChild(wrapper);
        }

        // 初期実行
        document.addEventListener("DOMContentLoaded", () => {
            updatePitchRender();
        });
    </script>
</body>
</html>
