<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* ピッチライン（SVGステップ表示）用スタイル */
        .custom-pitch-container {
            margin-bottom: 30px;
        }
        .pitch-row {
            display: flex;
            gap: 12px; /* ｜で分割されたセグメント間のスペース */
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .pitch-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 10px;
        }
        .mora-line {
            display: flex;
            gap: 0;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .mora-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2px;
        }
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line-path {
            fill: none;
            stroke: #e11d48;
            stroke-width: 1;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 指定された文の表示エリア -->
    <div class="custom-pitch-container" id="customPitchArea"></div>

    <!-- これまでに作成された元のドリルリスト表示エリア -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
    <script>
        // 文データ（segments: 各区切りのテキストと下がり目インデックスの定義）
        const targetSentences = [
            {
                segments: [
                    { text: "いいてんきですね", dropIndex: 1 }
                ]
            },
            {
                segments: [
                    { text: "わたしは", dropIndex: -1 },
                    { text: "がくせいです", dropIndex: -1 }
                ]
            },
            {
                segments: [
                    { text: "とけいが", dropIndex: -1 },
                    { text: "ほしいです", dropIndex: 1 } // 「ほ・し・い」の「し」の後ろで下がる例
                ]
            }
        ];

        function renderCustomPitchRows() {
            const container = document.getElementById("customPitchArea");
            if (!container) return;
            container.innerHTML = "";

            targetSentences.forEach(sentence => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "pitch-row";

                sentence.segments.forEach(seg => {
                    const wrapper = document.createElement("div");
                    wrapper.className = "pitch-wrapper";

                    const moraLine = document.createElement("div");
                    moraLine.className = "mora-line";

                    const chars = seg.text.split("");
                    chars.forEach(char => {
                        const moraItem = document.createElement("div");
                        moraItem.className = "mora-item";
                        const span = document.createElement("span");
                        span.textContent = char;
                        moraItem.appendChild(span);
                        moraLine.appendChild(moraItem);
                    });
                    wrapper.appendChild(moraLine);

                    const charCount = chars.length;
                    const unitWidth = 24.5;
                    const svgWidth = charCount * unitWidth;

                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("class", "pitch-svg");
                    svg.setAttribute("viewBox", `0 0 ${svgWidth} 50`);
                    svg.setAttribute("preserveAspectRatio", "none");

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("class", "pitch-line-path");

                    const dropIdx = seg.dropIndex;
                    let pathD = "";
                    if (dropIdx === -1 || dropIdx >= charCount - 1) {
                        pathD = `M 2,18 L ${svgWidth - 2},18`;
                    } else {
                        const dropX = (dropIdx + 1) * unitWidth;
                        pathD = `M 2,18 L ${dropX},18 L ${dropX},46 L ${svgWidth - 2},46`;
                    }
                    path.setAttribute("d", pathD);
                    svg.appendChild(path);
                    wrapper.appendChild(svg);

                    rowDiv.appendChild(wrapper);
                });

                container.appendChild(rowDiv);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderCustomPitchRows();
        });
    </script>
</body>
</html>
