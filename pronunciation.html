<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pitch Accent Line Test</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #333333;
        }
        .accent-display-box {
            display: inline-block;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 24px;
            border-radius: 8px;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 16px;
        }
        
        /* 1文字ずつのレイアウト構造 */
        .accent-row {
            display: flex;
            align-items: flex-end;
            position: relative;
            padding-top: 24px; /* 上の線のスペース */
        }
        .mora-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 36px; /* 1文字あたりの幅を固定してSVGと一致させる */
            position: relative;
        }
        .char {
            font-size: 24px;
            font-weight: bold;
            margin-top: 4px;
        }

        /* SVGを文字の直上に重ねるオーバーレイ */
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line {
            fill: none;
            stroke: #e11d48; /* 赤色のアクセントライン */
            stroke-width: 2.5;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
    </style>
</head>
<body>

    <div class="accent-display-box">
        <div class="title">ピッチアクセント表示テスト（1文字目の後ろで下がるパターン）</div>
        
        <div class="accent-row">
            <!-- 各文字の要素 -->
            <div class="mora-group"><span class="char">い</span></div>
            <div class="mora-group"><span class="char">い</span></div>
            <div class="mora-group"><span class="char">て</span></div>
            <div class="mora-group"><span class="char">ん</span></div>
            <div class="mora-group"><span class="char">き</span></div>
            <div class="mora-group"><span class="char">で</span></div>
            <div class="mora-group"><span class="char">す</span></div>
            <div class="mora-group"><span class="char">ね</span></div>

            <!-- SVGによるステップ状の赤線（1文字目の「い」と2文字目の「い」の間で下がるように調整） -->
            <!-- viewBoxの幅（例: 288px = 8文字 × 36px） -->
            <svg class="pitch-svg" viewBox="0 0 288 60" preserveAspectRatio="none">
                <path class="pitch-line" d="
                    M 2,4 
                    L 34,4 
                    L 34,45 
                    L 286,45
                " />
            </svg>
        </div>
    </div>

</body>
</html>
