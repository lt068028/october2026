<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* 臨時テストエリア用スタイル（既存コンテンツには影響を与えない） */
        .temp-test-area {
            margin-bottom: 30px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
            font-size: 20px;
            font-weight: bold;
            font-family: sans-serif;
            color: #e11d48; /* すべて赤色 */
            line-height: 1.8;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 臨時テストエリア: 3行の矢印テキスト表示 -->
    <div class="temp-test-area">
        <div>て➘んきが｜わ➚る➘くないですか⤴</div>
        <div>て⇘んきが｜わ⇗る⇘くないですか⤴</div>
        <div>て↘んきが｜わ↗る↘くないですか⤴</div>
    </div>

    <!-- これまでに作成された元のドリルリスト表示エリア（完全に保持） -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
