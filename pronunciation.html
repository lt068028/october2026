<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* 臨時テストエリア用スタイル */
        .temp-test-area {
            margin-bottom: 30px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
            font-size: 20px;
            font-weight: bold;
            font-family: sans-serif;
            line-height: 2.2;
            color: #0f172a;
        }
        
        /* シンボル（矢印・区切り線）は青字 */
        .symbol {
            color: #2563eb;
        }

        /* 共通の下線（標準の Underline） */
        .low-pitch {
            text-decoration: underline;
            text-decoration-color: #2563eb;
            text-decoration-thickness: 1px;
        }

        /* 方法A（1行目用）: Unicode結合文字による上線（で̅ や る゙̅ 等）はテキストデータ自体に含まれるためCSS不要だが、色を青にするため専用クラスを用意 */
        .combining-high {
            color: #2563eb; /* 結合文字自体の色制御用（環境により挙動が異なります） */
        }
        /* ベースの文字色は黒を維持しつつ結合文字に色を適用する場合のスタイル調整 */
        .char-base {
            color: #0f172a;
        }

        /* 方法B（2行目用）: box-shadowによる上線描画 */
        .box-shadow-high {
            box-shadow: 0 -1px 0 #2563eb;
            color: #0f172a;
        }

        /* 方法C（3行目用）: border-topによる上線 */
        .border-top-high {
            border-top: 1px solid #2563eb;
            padding-top: 0px;
            color: #0f172a;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 臨時テストエリア: 3つの異なる上線手法の比較 -->
    <div class="temp-test-area">
        <!-- 1行目: Unicode結合文字方式 (U+0305 オーバーラインを結合) -->
        <div><span class="combining-high">て̅</span><span class="symbol">➘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">➚</span><span class="combining-high">る̅</span><span class="symbol">➘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>

        <!-- 2行目: box-shadow方式 -->
        <div><span class="box-shadow-high">て</span><span class="symbol">⇘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">⇗</span><span class="box-shadow-high">る</span><span class="symbol">⇘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>

        <!-- 3行目: border-top方式 -->
        <div><span class="border-top-high">て</span><span class="symbol">↘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">↗</span><span class="border-top-high">る</span><span class="symbol">↘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>
    </div>

    <!-- これまでに作成された元のドリルリスト表示エリア（完全に保持） -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
