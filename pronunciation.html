<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* ピッチライン（SVGステップ表示）用スタイル */
        .custom-pitch-container {
            margin-bottom: 30px;
        }
        .pitch-row {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .pitch-wrapper {
            position: relative;
            display: inline-flex; /* インラインflexにして幅を子要素（SVGと文字）に完全に一致させる */
            align-items: flex-end;
            padding-top: 15px;
        }
        .mora-line {
            display: flex;
            gap: 0;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            z-index: 2; /* 文字をSVGの前面に配置 */
            position: relative;
        }
        .mora-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2px;
            width: 24.5px; /* 各モラの幅を固定してズレを防ぐ */
            box-sizing: border-box;
        }
        .pitch-svg {
            position: absolute;
            top: 15px; /* 縦のパディング位置に合わせる */
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        .pitch-line-path {
            fill: none;
            stroke: #e11d48;
            stroke-width: 1;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 指定された全文の表示エリア -->
    <div class="custom-pitch-container" id="customPitchArea"></div>

    <!-- これまでに作成された元のドリルリスト表示エリア -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
    <script>
        const targetSentences = [
            "い↘いてんきですね",
            "し↗ごとは｜た↗のし↘いです",
            "べ↗んきょうは｜お↗もしろ↘いです",
            "じ↗かんが｜ないですか｜⤴",
            "て↘んきが｜わ↗る↘いですか｜⤴",
            "て↘んきが｜よ↘くないです"
        ];

        function parseSegment(rawSegment) {
            let chars = [];
            let startLow = false;
            let riseIndex = -1;
            let dropIndex = -1;
            let hasEndRise = false;

            let i = 0;
            while (i < rawSegment.length) {
                let char = rawSegment[i];
                if (char === '↘') {
                    dropIndex = chars.length - 1;
                    i++;
                } else if (char === '↗') {
                    riseIndex = chars.length;
                    startLow = true;
                    i++;
                } else if (char === '⤴') {
                    hasEndRise = true;
                    i++;
                } else {
                    chars.push(char);
                    i++;
                }
            }

            if (riseIndex === -1) {
                startLow = false;
            }

            return { chars, startLow, riseIndex, dropIndex, hasEndRise };
        }

        function renderCustomPitchRows() {
            const container = document.getElementById("customPitchArea");
            if (!container) return;
            container.innerHTML = "";

            targetSentences.forEach(fullText => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "pitch-row";

                const rawSegments = fullText.split("｜");

                rawSegments.forEach(rawSeg => {
                    if (!rawSeg || rawSeg.trim() === "") return;

                    const parsed = parseSegment(rawSeg);
                    if (parsed.chars.length === 0 && !parsed.hasEndRise) return;

                    const wrapper = document.createElement("div");
                    wrapper.className = "pitch-wrapper";

                    const moraLine = document.createElement("div");
                    moraLine.className = "mora-line";

                    const unitWidth = 24.5;
                    const charCount = parsed.chars.length;
                    const svgWidth = charCount * unitWidth;

                    // 通常の文字を描画
                    parsed.chars.forEach((char) => {
                        const moraItem = document.createElement("div");
                        moraItem.className = "mora-item";
                        const span = document.createElement("span");
                        span.textContent = char;
                        moraItem.appendChild(span);
                        moraLine.appendChild(moraItem);
                    });

                    // ⤴ がある場合、SVG領域の外側（右側）の独立したアイテムとして配置
                    if (parsed.hasEndRise) {
                        const riseItem = document.createElement("div");
                        riseItem.className = "mora-item";
                        const span = document.createElement("span");
                        span.textContent = '⤴';
                        span.style.fontSize = "18px";
                        riseItem.appendChild(span);
                        moraLine.appendChild(riseItem);
                    }

                    wrapper.appendChild(moraLine);

                    // SVGの幅を文字数分（svgWidth）に厳格に固定し、⤴の影響を受けないようにする
                    if (charCount > 0) {
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.setAttribute("class", "pitch-svg");
                        svg.setAttribute("width", svgWidth);
                        svg.setAttribute("height", "50");
                        svg.setAttribute("viewBox", `0 0 ${svgWidth} 50`);
                        svg.setAttribute("preserveAspectRatio", "none");

                        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path.setAttribute("class", "pitch-line-path");

                        let pathD = "";
                        const startY = parsed.startLow ? 46 : 18;

                        if (parsed.startLow && parsed.riseIndex !== -1) {
                            const riseX = parsed.riseIndex * unitWidth;
                            if (parsed.dropIndex !== -1 && parsed.dropIndex < charCount) {
                                const dropX = (parsed.dropIndex + 1) * unitWidth;
                                pathD = `M 0,${startY} L ${riseX},${startY} L ${riseX},18 L ${dropX},18 L ${dropX},46 L ${svgWidth},46`;
                            } else {
                                pathD = `M 0,${startY} L ${riseX},${startY} L ${riseX},18 L ${svgWidth},18`;
                            }
                        } else {
                            if (parsed.dropIndex === -1 || parsed.dropIndex >= charCount) {
                                pathD = `M 0,${startY} L ${svgWidth},${startY}`;
                            } else {
                                const dropX = (parsed.dropIndex + 1) * unitWidth;
                                pathD = `M 0,${startY} L ${dropX},${startY} L ${dropX},46 L ${svgWidth},46`;
                            }
                        }

                        path.setAttribute("d", pathD);
                        svg.appendChild(path);
                        wrapper.appendChild(svg);
                    }

                    rowDiv.appendChild(wrapper);
                });

                container.appendChild(rowDiv);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderCustomPitchRows();
        });
    </script>
</body>
</html>
