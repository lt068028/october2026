<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* 矢印セット比較エリア用スタイル */
        .comparison-container {
            margin-bottom: 30px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
        .comparison-title {
            font-size: 14px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
        }
        .comparison-row {
            margin-bottom: 16px;
        }
        .comparison-row:last-child {
            margin-bottom: 0;
        }
        .mora-flex {
            display: flex;
            gap: 4px;
            align-items: flex-end;
        }
        .mora-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 28px;
            text-align: center;
        }
        .arrow-slot {
            height: 24px;
            font-size: 18px;
            line-height: 24px;
            color: #e11d48; /* すべて赤色に指定 */
            font-weight: bold;
        }
        .char-slot {
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 3種類の矢印セット比較表示エリア（テスト領域） -->
    <div class="comparison-container">
        <h2>「い↘いてんきですね」の矢印セット比較</h2>
        
        <!-- パターン1: 太い北東／南東矢印 (➚ / ➘) -->
        <div class="comparison-row">
            <div class="comparison-title">パターン1: 太い矢印 (➚ / ➘)</div>
            <div class="mora-flex">
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">い</span></div>
                <div class="mora-box"><span class="arrow-slot">➘</span><span class="char-slot">て</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">ん</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">き</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">で</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">す</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">ね</span></div>
            </div>
        </div>

        <!-- パターン2: 二重の北東／南東矢印 (⇗ / ⇘) -->
        <div class="comparison-row" style="margin-top: 12px;">
            <div class="comparison-title">パターン2: 二重矢印 (⇗ / ⇘)</div>
            <div class="mora-flex">
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">い</span></div>
                <div class="mora-box"><span class="arrow-slot">⇘</span><span class="char-slot">て</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">ん</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">き</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">で</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">す</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">ね</span></div>
            </div>
        </div>

        <!-- パターン3: ふつうの北東／南東矢印 (↗ / ↘) -->
        <div class="comparison-row" style="margin-top: 12px;">
            <div class="comparison-title">パターン3: ふつうの矢印 (↗ / ↘)</div>
            <div class="mora-flex">
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">い</span></div>
                <div class="mora-box"><span class="arrow-slot">↘</span><span class="char-slot">て</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">ん</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">き</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">で</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">す</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">ね</span></div>
            </div>
        </div>
    </div>

    <!-- これまでに作成された元のドリルリスト表示エリア（保持） -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
