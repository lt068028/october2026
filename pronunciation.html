<style>
.pitch-step-container {
    display: flex;
    align-items: flex-end;
    font-size: 24px;
    font-family: sans-serif;
    margin: 20px 0;
    padding: 10px;
}
.mora-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 0 4px;
}
.char {
    position: relative;
    z-index: 2;
    padding-top: 12px; /* 上の線との余白 */
}

/* 高い拍のスタイル（上に赤い横線、必要に応じて両脇に縦線） */
.mora-unit.high .char {
    color: #000;
}
.mora-unit.high::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #e11d48;
}

/* 低い拍のスタイル（下に赤い底線） */
.mora-unit.low::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #e11d48;
}

/* 下がり目の縦線（降下） */
.mora-unit.drop::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 2px;
    height: 24px;
    background-color: #e11d48;
    z-index: 1;
}

/* 上がり目の縦線（上昇） */
.mora-unit.rise::before {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 2px;
    height: 24px;
    background-color: #e11d48;
    z-index: 1;
}
</style>

<div class="pitch-step-container">
    <!-- い (High) -->
    <div class="mora-unit high">
        <span class="char">い</span>
    </div>
    <!-- い (High から Lowへ下がる境界) -->
    <div class="mora-unit high drop">
        <span class="char">い</span>
    </div>
    <!-- て (Low) -->
    <div class="mora-unit low">
        <span class="char">て</span>
    </div>
    <!-- ん (Low) -->
    <div class="mora-unit low">
        <span class="char">ん</span>
    </div>
    <!-- き (Low) -->
    <div class="mora-unit low">
        <span class="char">き</span>
    </div>
    <!-- で (Low) -->
    <div class="mora-unit low">
        <span class="char">で</span>
    </div>
    <!-- す (Low) -->
    <div class="mora-unit low">
        <span class="char">す</span>
    </div>
    <!-- ね (Low) -->
    <div class="mora-unit low">
        <span class="char">ね</span>
    </div>
</div>
