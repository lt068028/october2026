<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css?v=20261004">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }
        /* Temporary Area 用のスタイル */
        .temporary-area {
            background: var(--bg-panel);
            border: 1px dashed var(--accent-color);
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .temporary-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .temp-sentence {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .temp-sentence:last-child {
            margin-bottom: 0;
        }
        .temp-symbol {
            color: #fb7185;
            font-weight: normal !important;
        }
        
        /* 標準の上下線スタイル */
        .temp-high {
            text-decoration: overline;
            text-decoration-color: #fb7185;
            text-decoration-thickness: 1px;
            font-weight: normal !important;
        }
        .temp-low {
            text-decoration: underline;
            text-decoration-color: #fb7185;
            text-decoration-thickness: 1px;
            font-weight: normal !important;
        }

        /* 擬似要素（::before / ::after）を用いたカスタム上線・下線スタイル */
        .custom-high {
            position: relative;
        }
        .custom-high::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -2px; /* 文字のすぐ上へ配置 */
            height: 1px;
            background-color: #fb7185;
        }

        .custom-low {
            position: relative;
        }
        .custom-low::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 1px; /* 文字のすぐ下へ配置 */
            height: 1px;
            background-color: #fb7185;
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- Temporary Area: 3行の比較 -->
    <div class="temporary-area">
        <div class="temporary-title">Temporary Area (Comparison)</div>
        
        <!-- パターン1：標準の text-decoration による上下線 -->
        <div class="temp-sentence">
            <span class="temp-high">て</span><span class="temp-symbol">↘</span><span class="temp-low">んきが</span><span class="temp-symbol">｜</span><span class="temp-high">い</span><span class="temp-symbol">↘</span><span class="temp-low">いです</span>
        </div>

        <!-- パターン2：CSS擬似要素によるカスタム上下線 -->
        <div class="temp-sentence">
            <span class="custom-high">て</span><span class="temp-symbol">↘</span><span class="custom-low">んきが</span><span class="temp-symbol">｜</span><span class="custom-high">い</span><span class="temp-symbol">↘</span><span class="custom-low">いです</span>
        </div>

        <!-- パターン3：追加のテキスト確認用行 -->
        <div class="temp-sentence">
            <span>て</span><span class="temp-symbol">↘</span><span class="temp-low">んきが</span><span class="temp-symbol">｜</span><span>い</span><span class="temp-symbol">↘</span><span class="temp-low">いです</span>
        </div>
    </div>

    <!-- ドリルリスト表示エリア -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js?v=20261004"></script>
</body>
</html>
