<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* 臨時テストエリア用スタイル */
        .temp-test-area {
            margin-bottom: 30px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
            font-size: 20px;
            font-weight: bold;
            font-family: sans-serif;
            line-height: 2.0; /* 上下の絶対配置ラインのスペースを確保 */
            color: #0f172a;
        }
        
        /* シンボル（矢印・区切り線）は青字 */
        .symbol {
            color: #2563eb;
        }

        /* 高ピッチ（文字の直上にぎりぎり配置する上線） */
        .high-pitch {
            position: relative;
            display: inline-block;
        }
        .high-pitch::before {
            content: "";
            position: absolute;
            top: -3px; /* 文字の頭頂部からぎりぎりの位置に調整 */
            left: 0;
            right: 0;
            height: 1px;
            background-color: #2563eb;
        }

        /* 低ピッチ（文字の直下にぎりぎり配置する下線） */
        .low-pitch {
            position: relative;
            display: inline-block;
        }
        .low-pitch::after {
            content: "";
            position: absolute;
            bottom: -3px; /* 文字の底部からぎりぎりの位置に調整 */
            left: 0;
            right: 0;
            height: 1px;
            background-color: #2563eb;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 臨時テストエリア: 絶対配置による極限まで文字に寄せた上線・下線 -->
    <div class="temp-test-area">
        <div><span class="high-pitch">て</span><span class="symbol">➘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">➚</span><span class="high-pitch">る</span><span class="symbol">➘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>
        <div><span class="high-pitch">て</span><span class="symbol">⇘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">⇗</span><span class="high-pitch">る</span><span class="symbol">⇘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>
        <div><span class="high-pitch">て</span><span class="symbol">↘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">↗</span><span class="high-pitch">る</span><span class="symbol">↘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>
    </div>

    <!-- これまでに作成された元のドリルリスト表示エリア（完全に保持） -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
