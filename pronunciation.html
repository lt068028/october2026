<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* 臨時テストエリア用スタイル */
        .temp-test-area {
            margin-bottom: 30px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
            font-size: 20px;
            font-weight: bold;
            font-family: sans-serif;
            line-height: 2.5; /* 離れた位置の線が切れないよう行間を広げる */
            color: #0f172a;
        }
        
        /* シンボル（矢印・区切り線）は青字 */
        .symbol {
            color: #2563eb;
        }

        /* 共通の下線（標準の Underline） */
        .low-pitch {
            text-decoration: underline;
            text-decoration-color: #2563eb;
            text-decoration-thickness: 1px;
        }

        /* 1行目: box-shadow の Yオフセット -2px */
        .shadow-high-1 {
            box-shadow: 0 -2px 0 0 #2563eb;
            color: #0f172a;
        }

        /* 2行目: box-shadow の Yオフセット -4px */
        .shadow-high-2 {
            box-shadow: 0 -4px 0 0 #2563eb;
            color: #0f172a;
        }

        /* 3行目: box-shadow の Yオフセット -6px */
        .shadow-high-3 {
            box-shadow: 0 -6px 0 0 #2563eb;
            color: #0f172a;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- 臨時テストエリア: box-shadowのオフセット (-2, -4, -6) テスト -->
    <div class="temp-test-area">
        <!-- 1行目: -2px -->
        <div><span class="shadow-high-1">て</span><span class="symbol">➘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">➚</span><span class="shadow-high-1">る</span><span class="symbol">➘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>

        <!-- 2行目: -4px -->
        <div><span class="shadow-high-2">て</span><span class="symbol">⇘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">⇗</span><span class="shadow-high-2">る</span><span class="symbol">⇘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>

        <!-- 3行目: -6px -->
        <div><span class="shadow-high-3">て</span><span class="symbol">↘</span><span class="low-pitch">んきが</span><span class="symbol">｜</span><span class="low-pitch">わ</span><span class="symbol">↗</span><span class="shadow-high-3">る</span><span class="symbol">↘</span><span class="low-pitch">くないですか</span><span class="symbol">⤴</span></div>
    </div>

    <!-- これまでに作成された元のドリルリスト表示エリア（完全に保持） -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
