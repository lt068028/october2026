<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css?v=20261004">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }
        /* Temporary Area 用のスタイル */
        .temporary-area {
            background: var(--bg-panel);
            border: 1px dashed var(--accent-color);
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .temporary-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .temp-sentence {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }
        .temp-sentence:last-child {
            margin-bottom: 0;
        }
        .temp-symbol {
            color: #fb7185;
            font-weight: normal !important;
        }
        .temp-low {
            text-decoration: underline;
            text-decoration-color: #fb7185;
            text-decoration-thickness: 1px;
            font-weight: normal !important;
        }
        .temp-high {
            text-decoration: overline;
            text-decoration-color: #fb7185;
            text-decoration-thickness: 1px;
            font-weight: normal !important;
        }
        .label-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: block;
        }

        /* Ruby構造を利用した上線描画テスト用スタイル */
        ruby.ruby-overline {
            ruby-position: over;
        }
        ruby.ruby-overline rt {
            font-size: 100%;
            color: #fb7185;
            text-decoration: overline;
            text-decoration-thickness: 1px;
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- Temporary Area: 追加の3行を含む比較表示 -->
    <div class="temporary-area">
        <div class="temporary-title">Temporary Area (Comparison)</div>
        
        <!-- 追加1行目：text-decoration: overline 適用がわかる表示 -->
        <div class="temp-sentence">
            <span class="label-text">【1】text-decoration: overline 適用（標準）</span>
            <span class="temp-high">て</span><span class="temp-symbol">↘</span><span class="temp-low">んきが</span><span class="temp-symbol">｜</span><span class="temp-high">い</span><span class="temp-symbol">↘</span><span class="temp-low">いです</span>
        </div>

        <!-- 追加2行目：同様に overline を適用したことを追記した表示 -->
        <div class="temp-sentence">
            <span class="label-text">【2】同様に overline を適用</span>
            <span class="temp-high">て</span><span class="temp-symbol">↘</span><span class="temp-low">んきが</span><span class="temp-symbol">｜</span><span class="temp-high">い</span><span class="temp-symbol">↘</span><span class="temp-low">いです</span>
        </div>

        <!-- 追加3行目：Ruby構造を流用した上線描画テスト -->
        <div class="temp-sentence">
            <span class="label-text">【3】Ruby構造（rtタグ）による上線描画テスト</span>
            <ruby class="ruby-overline">て<rt>¯</rt></ruby><span class="temp-symbol">↘</span><span class="temp-low">んきが</span><span class="temp-symbol">｜</span><ruby class="ruby-overline">い<rt>¯</rt></ruby><span class="temp-symbol">↘</span><span class="temp-low">いです</span>
        </div>
    </div>

    <!-- ドリルリスト表示エリア -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js?v=20261004"></script>
</body>
</html>
