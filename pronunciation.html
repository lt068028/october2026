<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* ピッチライン（SVGステップ表示）のスタイル */
        .pitch-container {
            margin: 15px 0;
            padding: 16px;
            background: var(--bg-panel);
            border-radius: 6px;
            display: inline-block;
        }
        .pitch-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 10px;
        }
        /* 文字間隔を通常のテキストと同じにする（隙間をなくす） */
        .mora-line {
            display: flex;
            gap: 0;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .mora-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 固定幅を廃止し、文字幅にフィットさせる */
            padding: 0 2px;
        }
        /* SVGを文字の真上に重ねる（幅100%で文字コンテナ全体に同期） */
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line-path {
            fill: none;
            stroke: #e11d48;
            stroke-width: 1;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- ピッチパターンのテスト表示エリア -->
    <div class="pitch-container">
        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Pitch Accent Pattern (Test)</div>
        <div class="pitch-wrapper" id="pitchWrapper">
            <div class="mora-line" id="moraLine">
                <div class="mora-item"><span>い</span></div>
                <div class="mora-item"><span>い</span></div>
                <div class="mora-item"><span>て</span></div>
                <div class="mora-item"><span>ん</span></div>
                <div class="mora-item"><span>き</span></div>
                <div class="mora-item"><span>で</span></div>
                <div class="mora-item"><span>す</span></div>
                <div class="mora-item"><span>ね</span></div>
            </div>

            <!-- SVGによるステップ赤線（線をさらに1単位下げ、通常の文字幅に合わせたパス座標） -->
            <svg class="pitch-svg" viewBox="0 0 200 50" preserveAspectRatio="none">
                <path class="pitch-line-path" d="
                    M 2,18 
                    L 26,18 
                    L 26,46 
                    L 198,46
                " />
            </svg>
        </div>
    </div>

    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
