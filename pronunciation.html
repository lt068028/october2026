<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pitch Accent Line Test</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .accent-display-box {
            display: inline-block;
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 20px;
            border-radius: 8px;
        }
        .accent-row {
            position: relative;
            display: inline-flex;
            font-size: 24px;
            letter-spacing: 4px;
            padding-top: 25px; /* 上の線の描画スペース確保 */
        }
        /* 各文字のスタイル */
        .char-item {
            position: relative;
            padding: 0 4px;
        }
        /* 赤いピッチラインを描画するSVGのスタイル */
        .pitch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .pitch-line {
            fill: none;
            stroke: #e11d48; /* 赤色のライン */
            stroke-width: 2;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
    </style>
</head>
<body>

    <div class="accent-display-box">
        <div style="font-size: 14px; color: #64748b; margin-bottom: 8px;">SVGによるピッチライン表示テスト</div>
        
        <div class="accent-row">
            <!-- 文字列 -->
            <span class="char-item">い</span>
            <span class="char-item">い</span>
            <span class="char-item">て</span>
            <span class="char-item">ん</span>
            <span class="char-item">き</span>
            <span class="char-item">で</span>
            <span class="char-item">す</span>
            <span class="char-item">ね</span>

            <!-- 赤い折れ線（SVGオーバーレイ） -->
            <!-- ※「いい」が高く、3文字目の「て」から下に落ちるパターン（頭高の例） -->
            <svg class="pitch-svg" viewBox="0 0 280 50" preserveAspectRatio="none">
                <!-- 
                  座標の仕組み: 
                  - 高い位置のY軸: 5
                  - 低い位置のY軸: 35
                  - 下がり目の垂直線を入れることでカクッとしたステップを表現
                -->
                <path class="pitch-line" d="
                    M 5,5 
                    L 55,5 
                    L 55,35 
                    L 275,35
                " />
            </svg>
        </div>
    </div>

</body>
</html>
