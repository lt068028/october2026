<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* シンプルなテスト表示エリア用スタイル */
        .comparison-container {
            margin-bottom: 30px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
        .comparison-row {
            margin-bottom: 16px;
        }
        .comparison-row:last-child {
            margin-bottom: 0;
        }
        .mora-flex {
            display: flex;
            gap: 2px;
            align-items: flex-end;
        }
        .mora-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 26px;
            text-align: center;
        }
        .arrow-slot {
            height: 24px;
            font-size: 18px;
            line-height: 24px;
            color: #e11d48; /* すべて赤色 */
            font-weight: bold;
        }
        .char-slot {
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
        }
        .separator-slot {
            display: flex;
            align-items: flex-end;
            font-size: 20px;
            font-weight: bold;
            color: #e11d48; /* 区切り線も赤色 */
            padding: 0 4px;
            height: 48px;
            line-height: 48px;
        }

        /* 既存ドリルリスト用スタイル */
        .drill-item {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-panel, #f8fafc);
            border-radius: 8px;
            border: 1px solid var(--border-color, #cbd5e1);
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>
    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <!-- テスト表示エリア -->
    <div class="comparison-container">
        
        <!-- 1行目: て➘んきが｜わ➚る➘くないですか⤴ -->
        <div class="comparison-row">
            <div class="mora-flex">
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">て</span></div>
                <div class="mora-box"><span class="arrow-slot">➘</span><span class="char-slot">ん</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">き</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">が</span></div>
                <div class="separator-slot">｜</div>
                <div class="mora-box"><span class="arrow-slot">➚</span><span class="char-slot">わ</span></div>
                <div class="mora-box"><span class="arrow-slot">➘</span><span class="char-slot">る</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">く</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">な</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">い</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">で</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">す</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">か</span></div>
                <div class="mora-box"><span class="arrow-slot">⤴</span><span class="char-slot"></span></div>
            </div>
        </div>

        <!-- 2行目: て⇘んきが｜わ⇗る⇘くないですか⤴ -->
        <div class="comparison-row">
            <div class="mora-flex">
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">て</span></div>
                <div class="mora-box"><span class="arrow-slot">⇘</span><span class="char-slot">ん</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">き</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">が</span></div>
                <div class="separator-slot">｜</div>
                <div class="mora-box"><span class="arrow-slot">⇗</span><span class="char-slot">わ</span></div>
                <div class="mora-box"><span class="arrow-slot">⇘</span><span class="char-slot">る</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">く</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">な</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">い</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">で</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">す</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">か</span></div>
                <div class="mora-box"><span class="arrow-slot">⤴</span><span class="char-slot"></span></div>
            </div>
        </div>

        <!-- 3行目: て↘んきが｜わ↗る↘くないですか⤴ -->
        <div class="comparison-row">
            <div class="mora-flex">
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">て</span></div>
                <div class="mora-box"><span class="arrow-slot">↘</span><span class="char-slot">ん</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">き</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">が</span></div>
                <div class="separator-slot">｜</div>
                <div class="mora-box"><span class="arrow-slot">↗</span><span class="char-slot">わ</span></div>
                <div class="mora-box"><span class="arrow-slot">↘</span><span class="char-slot">る</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">く</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">な</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">い</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">で</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">す</span></div>
                <div class="mora-box"><span class="arrow-slot"></span><span class="char-slot">か</span></div>
                <div class="mora-box"><span class="arrow-slot">⤴</span><span class="char-slot"></span></div>
            </div>
        </div>

    </div>

    <!-- これまでに作成された元のドリルリスト表示エリア（保持） -->
    <div id="drillList" style="margin-top: 20px;"></div>

    <script src="pronunciation.js"></script>
</body>
</html>
