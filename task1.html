<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 1；XはYです</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* インフォメーションパネル風スタイル（案A） */
        .panel-style {
            background-color: #e8f4fd;
            border-left: 4px solid #2196f3;
            padding: 12px 16px;
            border-radius: 0 4px 4px 0;
            color: #333;
            font-size: 14px;
            margin-top: 8px;
            width: 100%;
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* ヘッダー全体のレイアウト調整 */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #f1f5f9;
            border-radius: 6px;
            font-family: sans-serif;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 300px;
        }
    </style>
</head>
<body>
    <h1>Practice 1；XはYです</h1>

    <!-- Task 1の例（Affirmative / Negative）が表示されるコンテナ -->
    <div id="exampleSection"></div>

    <!-- ドリルおよびTask 2が動的に挿入されるメインコンテナ -->
    <div id="task1List"></div>

    <!-- =========================================================
         Footer
         ========================================================= -->
    <div class="voice-guide-footer">
        🔊Want to change the voice?
        <span id="guideTrigger" class="guide-trigger">
            Check⚙️
        </span>

        <div
            id="guideBox"
            class="guide-box-popup"
            style="display: none;"
        >
            Win: Settings > Time & Language > Speech<br>
            Mac/iOS: Settings > Accessibility > Spoken Content<br>
            ChromeOS: Settings > Advanced > Accessibility > Text-to-Speech
        </div>
    </div>

    <!-- JavaScriptファイル（ファイル名が task1.js であることを確認せよ） -->
    <script src="task1.js"></script>
</body>
</html>
