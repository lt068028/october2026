<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Practice 1: XはYです</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ツールチップスタイル */
        .tooltip-wrap {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted #2196F3;
        }
        .tooltip-wrap .tooltip-tip {
            visibility: hidden;
            width: 70px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 3px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -35px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 11px;
        }
        .tooltip-wrap:hover .tooltip-tip {
            visibility: visible;
            opacity: 1;
        }

        /* 水色背景セクションの共通スタイル */
        .section-header-box {
            background-color: #e3f2fd; /* 水色の背景 */
            border-left: 4px solid #2196F3;
            padding: 10px 15px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <a href="index.html" style="text-decoration: none; color: #2196F3; font-weight: bold; font-family: sans-serif;">↩️️もどる</a>
    </div>

    <!-- 正しいタイトル -->
    <h1>Practice 1：XはYです</h1>

    <!-- 例文セクション（JS連動） -->
    <div id="exampleSection"></div>

    <!-- 水色背景のヘッダーエリア（Affirmative / Negative等の見出しの下） -->
    <div class="section-header-box">
        <div style="font-weight: bold; font-size: 16px; color: #0d47a1;">Task 1；Drills</div>
        <div style="color: #333; font-size: 14px;">💡 Make a sentence using "XはYです" (affirmative) or "XはYじゃないです" (negative) based on the given words.</div>
    </div>

    <div id="task1List" style="margin-top: 20px;"></div>

    <script src="task1.js"></script>
</body>
</html>
