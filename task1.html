<!-- Custom Practice セクション（プルダウン＆日本語右側表示） -->
    <div style="background: #ffffff; border: 1px solid #cbd5e1; padding: 20px; border-radius: 8px; margin-top: 30px; font-family: sans-serif;">
        <h3 style="margin-top: 0; color: #1e293b;">Custom Practice (XはYです、XはYじゃないです)</h3>
        <p style="color: #555; font-size: 14px; margin-bottom: 20px;">Make a sentence using "XはYです" (affirmative) or "XはYじゃないです" (negative) based on the given words.</p>

        <!-- Xの選択 -->
        <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <label for="select-x" style="font-weight: bold; font-size: 14px; min-width: 120px;">Select X (Person):</label>
            <select id="select-x" onchange="updateTranslation('x')" style="flex: 1; min-width: 220px; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="" disabled selected>-- Choose an option --</option>
                <option value="ともだち">Friend</option>
                <option value="かぞく">Family</option>
                <option value="どうりょう">Colleague</option>
                <option value="じょうし">Boss</option>
                <option value="パートナー">Partner</option>
                <option value="こいびと">boyfriend/girlfriend</option>
                <option value="しんゆう">Best friend</option>
                <option value="こども">Child</option>
                <option value="まご">Grandchild</option>
                <option value="きょうだい">Sibling</option>
            </select>
            <div style="font-size: 15px; min-width: 150px;">
                <span id="trans-x">&rarr; <strong>(Not selected)</strong></span>
            </div>
        </div>

        <!-- Yの選択 -->
        <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <label for="select-y" style="font-weight: bold; font-size: 14px; min-width: 120px;">Select Y (Occupation):</label>
            <select id="select-y" onchange="updateTranslation('y')" style="flex: 1; min-width: 220px; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="" disabled selected>-- Choose an option --</option>
                <option value="いしゃ">Doctor</option>
                <option value="エンジニア">Engineer</option>
                <option value="けんきゅうしゃ">Researcher</option>
                <option value="デザイナー">Designer</option>
                <option value="てんいん">Store staff</option>
                <option value="じえいぎょう">Self-employed</option>
                <option value="こうむいん">Civil servant</option>
                <option value="かんごし">Nurse</option>
                <option value="アルバイト">Part-time worker</option>
            </select>
            <div style="font-size: 15px; min-width: 150px;">
                <span id="trans-y">&rarr; <strong>(Not selected)</strong></span>
            </div>
        </div>
    </div>

    <script>
        function updateTranslation(type) {
            const select = document.getElementById(`select-${type}`);
            const display = document.getElementById(`trans-${type}`);
            const selectedValue = select.value;
            
            if (selectedValue) {
                display.innerHTML = `&rarr; <strong>${selectedValue}</strong>`;
            } else {
                display.innerHTML = `&rarr; <strong>(Not selected)</strong>`;
            }
        }
    </script>
