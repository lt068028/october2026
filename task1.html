<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XはYです</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 戻るリンク配置エリア -->
    <div style="margin-bottom: 15px;">
        <a href="#" onclick="window.history.back(); return false;" style="text-decoration: none; color: var(--text-primary, #333); font-weight: bold; font-size: 16px;">
            ↩️ もどる
        </a>
    </div>

    <h1>Practice1；XはYです</h1>

    <!-- Exampleセクション -->
    <div id="exampleSection"></div>
    
    <!-- 共通設定パネル（3つのトグル）配置エリア -->
    <div id="globalSettingsSection"></div>

    <!-- Task 1 & 2 配置エリア -->
    <div id="task1List"></div>

    <!-- =========================================================
         Footer
         ========================================================= -->
    <div class="voice-guide-footer">
        🔊Want to change the voice?
        <span id="guideTrigger" class="guide-trigger">
            Check⚙️
        </span>

        <div
            id="guideBox"
            class="guide-box-popup"
            style="display: none;"
        >
            Win: Settings > Time & Language > Speech<br>
            Mac/iOS: Settings > Accessibility > Spoken Content<br>
            ChromeOS: Settings > Advanced > Accessibility > Text-to-Speech
        </div>
    </div>

    <script src="task1.js"></script>
</body>
</html>
