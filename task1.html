<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Task 2: Custom Practice</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ツールチップスタイル（Task 1と共通） */
        .tooltip-wrap {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted #2196F3;
        }
        .tooltip-wrap .tooltip-tip {
            visibility: hidden;
            width: 70px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 3px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -35px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 11px;
        }
        .tooltip-wrap:hover .tooltip-tip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <a href="index.html" style="text-decoration: none; color: #2196F3; font-weight: bold; font-family: sans-serif;">↩️もどる</a>
    </div>
    <h1>Custom Practice</h1>
    
    <!-- フォントサイズをTask 1と統一 -->
    <p style="color: #555; font-size: 16px; margin-bottom: 15px;">Create your own sentences or practice with custom vocabulary items.</p>

    <!-- 例文セクション（JS連動） -->
    <div id="exampleSection"></div>

    <!-- カスタムプラクティス用の表示エリア -->
    <div id="task2List" style="margin-top: 20px;"></div>

    <script src="task2.js"></script>
</body>
</html>
