    <h1>Genki 1: Lesson 1 - Task 1</h1>
    
    <!-- 最小限の英語説明 -->
    <p style="color: #555; font-size: 14px;">Make a sentence using "XはYです" (affirmative) or "XはYじゃないです" (negative) based on the given words. Decide whether it's affirmative or negative yourself.</p>

    <!-- 例文セクション -->
    <div style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-family: sans-serif;">
        <strong>Example:</strong> わたし / せいと (Student) / せんせい (Teacher)<br>
        <span style="font-size: 15px; color: #334155; margin-right: 10px;">• わたしは、せいとです。</span>
        <button id="ex1Listen" style="padding: 4px 8px; font-size: 13px;">🔊 きく</button><br>
        <span style="font-size: 15px; color: #334155; margin-right: 10px; display: inline-block; margin-top: 6px;">• わたしは、せんせいじゃないです。</span>
        <button id="ex2Listen" style="padding: 4px 8px; font-size: 13px;">🔊 きく</button>
    </div>
