<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Task 1: XはYです</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ツールチップスタイル */
        .tooltip-wrap {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted #2196F3;
        }
        .tooltip-wrap .tooltip-tip {
            visibility: hidden;
            width: 70px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 3px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -35px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 11px;
        }
        .tooltip-wrap:hover .tooltip-tip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <a href="index.html" style="text-decoration: none; color: #2196F3; font-weight: bold; font-family: sans-serif;">↩️もどる</a>
    </div>

    <!-- 元のタイトル構造 -->
    <h1>Task 1: XはYです</h1>

    <!-- Task 1 Drills と指示文、Autostopの配置コンテナ -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <!-- 左側：Task 1 Drills -->
        <div style="font-size: 20px; font-weight: bold;">Task 1 Drills</div>

        <!-- 中央〜右側：💡の指示文（Autostopの左側に位置する） -->
        <div style="color: #555; font-size: 14px; flex-grow: 1; text-align: right; margin-right: 15px;">
            💡 Make a sentence using "XはYです" (affirmative) or "XはYじゃないです" (negative) based on the given words.
        </div>

        <!-- 右端：Autostopボタン（例） -->
        <button id="autostopBtn" style="padding: 5px 10px;">Autostop</button>
    </div>

    <!-- 例文セクション（JS連動） -->
    <div id="exampleSection"></div>

    <div id="task1List" style="margin-top: 20px;"></div>

    <script src="task1.js"></script>
</body>
</html>
