<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pronunciation Drill 1</title>
    <!-- 共通CSSはそのまま（Task 1 がこれを使っているため） -->
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-family: sans-serif;
        }

        /* --- 発音練習ページ専用のレイアウト設定 --- */
        /* これをここに追加することで共通CSSに依存せず表示できます */
        
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .drill-row {
            background-color: var(--bg-row);
            border: 1px solid var(--border-color);
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .top-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .sentence-label {
            font-size: 18px;
            min-width: 220px;
        }

        .result-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
            flex-grow: 1;
        }

        .play-record-btn {
            display: none; /* 録音されるまで隠す */
        }

        .meaning-container {
            position: relative;
            margin-left: auto;
        }

        .meaning-popup {
            display: none;
            position: absolute;
            right: 0; bottom: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            white-space: nowrap;
            z-index: 10;
        }
        .meaning-popup.show { display: block; }

        .high-pitch { text-decoration: overline; text-decoration-thickness: 2px; }
        .low-pitch { text-decoration: underline; text-decoration-thickness: 2px; }

        /* スイッチなどのコントロール用 */
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-item { display: flex; align-items: center; gap: 8px; }

        /* Temporary Area */
        .temporary-area {
            background: var(--bg-panel);
            border: 1px dashed var(--accent-color);
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="back-link-container">
        <a href="index.html" class="back-link">↩️もどる</a>
    </div>

    <h1>音声を聞いて、とるを押して、文を読もう</h1>
    <p>Listen to the model audio, press record, and read the sentence.</p>

    <div class="temporary-area">
        <div class="temporary-title">Temporary Area (Pitch Visualization Roadmap)</div>
        <ul class="roadmap-list" style="margin:0; padding-left:20px; font-size:14px;">
            <li>Step 1-6: ピッチ表示の準備中</li>
        </ul>
    </div>

    <div id="drillList"></div>

    <!-- ファイル名が pronunciation.js の場合 -->
    <script src="pronunciation.js"></script>
</body>
</html>
